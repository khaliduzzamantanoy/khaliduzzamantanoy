<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .t{font-family:Consolas,Menlo,monospace;fill:#E2E8F0;font-size:15px;font-weight:bold;text-anchor:middle}
    .s{font-family:Consolas,Menlo,monospace;fill:#94A3B8;font-size:11px;text-anchor:middle}
    .n{fill:#111827;stroke:#38BDF8;stroke-width:1.5}
    .pulse{animation:p 2.4s ease-in-out infinite}
    @keyframes p{0%,100%{stroke-opacity:.35}50%{stroke-opacity:1}}
  </style>
  <rect width="1000" height="230" rx="14" fill="#0D1117"/>
  <text x="500" y="30" class="t" style="font-size:16px;fill:#38BDF8">FROM SENSOR TO DASHBOARD</text>

  <path id="p1" d="M110 120 H270" stroke="#38BDF8" stroke-opacity=".3" stroke-dasharray="4 6" fill="none"/>
  <path id="p2" d="M330 120 H490" stroke="#38BDF8" stroke-opacity=".3" stroke-dasharray="4 6" fill="none"/>
  <path id="p3" d="M550 120 H710" stroke="#38BDF8" stroke-opacity=".3" stroke-dasharray="4 6" fill="none"/>
  <path id="p4" d="M770 120 H890" stroke="#38BDF8" stroke-opacity=".3" stroke-dasharray="4 6" fill="none"/>

  <g class="pulse"><rect class="n" x="20" y="85" width="90" height="70" rx="12"/></g>
  <text class="t" x="65" y="118">IoT</text><text class="s" x="65" y="136">sensors</text>

  <g class="pulse" style="animation-delay:.4s"><rect class="n" x="270" y="85" width="60" height="70" rx="12" stroke="#A78BFA"/></g>
  <text class="t" x="300" y="118">MQTT</text><text class="s" x="300" y="136">broker</text>

  <g class="pulse" style="animation-delay:.8s"><rect class="n" x="490" y="85" width="60" height="70" rx="12" stroke="#34D399"/></g>
  <text class="t" x="520" y="118">K8s</text><text class="s" x="520" y="136">cluster</text>

  <g class="pulse" style="animation-delay:1.2s"><rect class="n" x="710" y="85" width="60" height="70" rx="12" stroke="#F59E0B"/></g>
  <text class="t" x="740" y="118">API</text><text class="s" x="740" y="136">Laravel/Node</text>

  <g class="pulse" style="animation-delay:1.6s"><rect class="n" x="890" y="85" width="90" height="70" rx="12" stroke="#F472B6"/></g>
  <text class="t" x="935" y="118">React</text><text class="s" x="935" y="136">dashboard</text>

  <g fill="#38BDF8">
    <circle r="4"><animateMotion dur="2s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
    <circle r="4" fill="#A78BFA"><animateMotion dur="2s" begin=".5s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
    <circle r="4" fill="#34D399"><animateMotion dur="2s" begin="1s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
    <circle r="4" fill="#F59E0B"><animateMotion dur="1.6s" begin="1.5s" repeatCount="indefinite"><mpath href="#p4"/></animateMotion></circle>
  </g>
  <text x="500" y="205" class="s">containerized · automated with CI/CD · deployed on the cloud</text>
</svg>
