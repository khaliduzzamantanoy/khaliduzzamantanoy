<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="title" x1="0" x2="1">
      <stop offset="0" stop-color="#38BDF8"/><stop offset="0.5" stop-color="#A78BFA"/><stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
  </defs>
  <style>
    .m{font-family:Consolas,Menlo,'Courier New',monospace;font-weight:bold}
  </style>

  <rect width="1000" height="300" rx="14" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#fff">
    <circle cx="60" cy="40" r="1.5"><animate attributeName="opacity" values="1;.2;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="190" cy="70" r="1"><animate attributeName="opacity" values=".2;1;.2" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="30" r="1.5"><animate attributeName="opacity" values="1;.3;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="55" r="1"><animate attributeName="opacity" values=".3;1;.3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="35" r="1.5"><animate attributeName="opacity" values="1;.2;1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="790" cy="65" r="1"><animate attributeName="opacity" values=".2;1;.2" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="920" cy="30" r="1.5"><animate attributeName="opacity" values="1;.3;1" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="110" r="1"><animate attributeName="opacity" values=".3;1;.3" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- moon -->
  <circle cx="900" cy="60" r="22" fill="#E2E8F0" opacity=".9"/>
  <circle cx="910" cy="54" r="22" fill="#0F1330"/>

  <!-- clouds -->
  <g fill="#334155" opacity=".6">
    <g><ellipse cx="0" cy="0" rx="40" ry="10"/><ellipse cx="22" cy="-8" rx="24" ry="9"/>
      <animateTransform attributeName="transform" type="translate" values="1100 175;-100 175" dur="26s" repeatCount="indefinite"/></g>
    <g><ellipse cx="0" cy="0" rx="34" ry="8"/><ellipse cx="18" cy="-7" rx="20" ry="8"/>
      <animateTransform attributeName="transform" type="translate" values="1100 150;-100 150" dur="34s" begin="-14s" repeatCount="indefinite"/></g>
  </g>

  <!-- title -->
  <text x="500" y="92" text-anchor="middle" class="m" font-size="40" fill="url(#title)">MD. KHALIDUZZAMAN TANOY</text>
  <text x="500" y="128" text-anchor="middle" class="m" font-size="16" fill="#CBD5E1" letter-spacing="2">FULL STACK  ·  CLOUD &amp; DEVOPS  ·  KUBERNETES  ·  IOT</text>

  <!-- HUD -->
  <text x="24" y="30" class="m" font-size="14" fill="#94A3B8">HI-SCORE 99999</text>
  <g class="m" font-size="14" fill="#38BDF8" text-anchor="end">
    <text x="976" y="30">LEVEL 1: LARAVEL + REACT
      <animate attributeName="opacity" values="1;1;0;0;0;0" keyTimes="0;0.32;0.33;0.66;0.67;1" calcMode="discrete" dur="9s" repeatCount="indefinite"/></text>
    <text x="976" y="30" fill="#34D399">LEVEL 2: KUBERNETES + CI/CD
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.32;0.33;0.66;0.67;1" calcMode="discrete" dur="9s" repeatCount="indefinite"/></text>
    <text x="976" y="30" fill="#F472B6">LEVEL 3: IOT + MQTT
      <animate attributeName="opacity" values="0;0;0;0;1;1" keyTimes="0;0.32;0.33;0.66;0.67;1" calcMode="discrete" dur="9s" repeatCount="indefinite"/></text>
  </g>

  <!-- ground -->
  <line x1="0" y1="252" x2="1000" y2="252" stroke="#38BDF8" stroke-width="2" opacity=".6"/>
  <line x1="0" y1="266" x2="1000" y2="266" stroke="#A78BFA" stroke-width="2" stroke-dasharray="20 14" opacity=".5">
    <animate attributeName="stroke-dashoffset" from="0" to="-68" dur="0.6s" repeatCount="indefinite"/>
  </line>
  <line x1="0" y1="282" x2="1000" y2="282" stroke="#F472B6" stroke-width="2" stroke-dasharray="8 22" opacity=".4">
    <animate attributeName="stroke-dashoffset" from="0" to="-60" dur="0.9s" repeatCount="indefinite"/>
  </line>

  <!-- coins -->
  <g fill="#FBBF24" stroke="#F59E0B" stroke-width="2">
    <circle r="8"><animateTransform attributeName="transform" type="translate" values="1050 180;-50 180" dur="4s" begin="-1s" repeatCount="indefinite"/><animate attributeName="rx" values="8;3;8" dur="0.8s" repeatCount="indefinite"/></circle>
    <circle r="8"><animateTransform attributeName="transform" type="translate" values="1050 170;-50 170" dur="4s" begin="-3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- obstacles (bugs) -->
  <g>
    <g>
      <rect x="0" y="0" width="28" height="28" rx="4" fill="#EF4444"/>
      <rect x="6" y="8" width="5" height="5" fill="#fff"/><rect x="17" y="8" width="5" height="5" fill="#fff"/>
      <rect x="8" y="19" width="12" height="3" fill="#7F1D1D"/>
      <animateTransform attributeName="transform" type="translate" values="1050 224;-50 224" dur="4s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="0" y="0" width="28" height="28" rx="4" fill="#F97316"/>
      <rect x="6" y="8" width="5" height="5" fill="#fff"/><rect x="17" y="8" width="5" height="5" fill="#fff"/>
      <rect x="8" y="19" width="12" height="3" fill="#7C2D12"/>
      <animateTransform attributeName="transform" type="translate" values="1050 224;-50 224" dur="4s" begin="-2s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- player (the dev) -->
  <g transform="translate(120 214)">
    <g>
      <rect x="2" y="0" width="16" height="14" rx="3" fill="#FCD9B6"/>
      <rect x="0" y="-2" width="20" height="6" rx="2" fill="#38BDF8"/>
      <rect x="11" y="6" width="3" height="3" fill="#0B1020"/>
      <rect x="0" y="14" width="20" height="14" rx="2" fill="#A78BFA"/>
      <rect x="20" y="16" width="10" height="7" rx="1" fill="#0F172A" stroke="#38BDF8"/>
      <g fill="#1E293B">
        <rect x="2" y="28" width="6" height="8"><animate attributeName="height" values="8;3;8" dur="0.3s" repeatCount="indefinite"/></rect>
        <rect x="12" y="28" width="6" height="3"><animate attributeName="height" values="3;8;3" dur="0.3s" repeatCount="indefinite"/></rect>
      </g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0;0 0;0 -72;0 0;0 0;0 -72;0 0;0 0"
        keyTimes="0;0.26;0.345;0.43;0.76;0.845;0.93;1" dur="4s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
